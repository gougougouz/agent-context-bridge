name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check zstandard

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the CLI
        env:
          PYTHONPATH: src
        run: |
          python -m agentlink --version
          python -m agentlink doctor || true

      - name: Smoke test the Linux launcher (through a symlink)
        if: runner.os == 'Linux'
        run: |
          sh bin/agentlink.sh --version
          mkdir -p "$RUNNER_TEMP/linkbin"
          ln -sf "$PWD/bin/agentlink.sh" "$RUNNER_TEMP/linkbin/agentlink"
          (cd / && "$RUNNER_TEMP/linkbin/agentlink" --version)

      - name: Smoke test the Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: bin\agentlink.cmd --version